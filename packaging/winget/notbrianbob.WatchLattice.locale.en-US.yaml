ShortDescription: Experimental Windows security tools that run alongside Microsoft Defender.
Description: |-
  WatchLattice is an experimental, open-source Windows security toolkit that
  complements Microsoft Defender with deception-based defenses, ransomware
  tripwires and continuous security-health monitoring. Its tools run together
  in one background service with a tray dashboard, and each can be switched
  on or off. It is a supplement to a real anti-malware product, not a
  replacement for one.
