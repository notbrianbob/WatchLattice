## Template: .github/scripts/Write-WingetManifest.ps1 fills in the {{...}}
## values for a release. See packaging/winget/README.md.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json

PackageIdentifier: notbrianbob.WatchLattice
PackageVersion: {{VERSION}}
MinimumOSVersion: 10.0.17763.0
InstallerType: msi
Scope: machine
InstallModes:
- interactive
- silent
- silentWithProgress
UpgradeBehavior: install
# The hub and tray are framework-dependent; the Desktop Runtime includes the
# .NET Runtime the hub needs. The MSI checks for it too and stops if missing.
Dependencies:
  PackageDependencies:
  - PackageIdentifier: Microsoft.DotNet.DesktopRuntime.8
ReleaseDate: {{RELEASE_DATE}}
Installers:
- Architecture: x64
  InstallerUrl: {{INSTALLER_URL}}
  InstallerSha256: {{INSTALLER_SHA256}}
  ProductCode: '{{PRODUCT_CODE}}'
  # Windows Installer versions are numeric, so a prerelease such as
  # 0.7.0-beta.1 shows as 0.7.0 in Settings > Apps.
  AppsAndFeaturesEntries:
  - DisplayName: WatchLattice
    Publisher: WatchLattice contributors
    DisplayVersion: {{MSI_VERSION}}
    ProductCode: '{{PRODUCT_CODE}}'
    UpgradeCode: '{21E8E3ED-618D-4DCD-8E14-79555B2974AD}'
ManifestType: installer
ManifestVersion: 1.10.0
