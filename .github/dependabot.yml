version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*", "System.Diagnostics.EventLog", "System.Threading.AccessControl"]
      test-tooling:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
