name: Release

# Pushing a tag like v0.2.0 builds, tests and publishes a GitHub Release with:
#   WatchLattice-<version>-win-x64.zip   Hub/ and Tray/, framework-dependent, with
#                                        Hub/WatchLattice.files.sha256 (per-file hashes)
#   WatchLattice-<version>-win-x64.msi   the same files as a Windows Installer package
#                                        (packaging/msi); the in-hub updater keeps using the zip
#   SHA256SUMS.txt                       both of them; the updater checks the zip's line before installing
# with the tag's CHANGELOG.md section as the release notes,
# plus a build provenance attestation for the zip and MSI (verify with `gh attestation verify`).
#
# When SignPath is configured (see docs/code-signing.md), the published
# WatchLattice and ScanAlways executables and DLLs are Authenticode-signed
# before they are zipped, and the MSI is signed after it is built. Without the
# SignPath secrets the release is built unsigned, exactly as before, and the
# log says so.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    permissions:
      contents: write      # create the release
      actions: read        # let SignPath read this run's unsigned artifact
      id-token: write      # sign the provenance attestation
      attestations: write

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Named RELEASE_VERSION, not VERSION: MSBuild reads environment variables
      # as properties, so VERSION would stamp the test build as a release too.
      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v((0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$') {
            throw "Tag '$env:TAG' is not a release version like v1.2.3 or v1.2.3-beta.1."
          }
          $version = $Matches[1]
          if ($version -match '(^|[.-])dev([.-]|$)') { throw "Release versions must not contain 'dev'; the updater treats those as development builds." }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test -c Release

      - name: Publish hub and tray
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'package'
          dotnet publish src/WatchLattice.Hub  -c Release -r win-x64 --self-contained false -p:Version=$env:RELEASE_VERSION -o (Join-Path $stage 'Hub')
          dotnet publish src/WatchLattice.Tray -c Release -r win-x64 --self-contained false -p:Version=$env:RELEASE_VERSION -o (Join-Path $stage 'Tray')
          Copy-Item LICENSE, README.md $stage
          Get-ChildItem $stage -Recurse -Filter *.pdb | Remove-Item
          "STAGE=$stage" >> $env:GITHUB_ENV

      # Signing is optional so releases keep working before SignPath is set up.
      # Once SIGNPATH_API_TOKEN and SIGNPATH_ORGANIZATION_ID exist, a release
      # that cannot be signed fails instead of shipping unsigned.
      - name: Check code signing configuration
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
        run: |
          if ($env:SIGNPATH_API_TOKEN -and $env:SIGNPATH_ORGANIZATION_ID) {
            "enabled=true" >> $env:GITHUB_OUTPUT
            Write-Host "Code signing is configured; binaries will be signed through SignPath."
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Host "::notice title=Release is not code-signed::SIGNPATH_API_TOKEN and SIGNPATH_ORGANIZATION_ID are not both set, so signing was skipped and this release's binaries are unsigned. See docs/code-signing.md."
          }

      - name: Upload unsigned binaries for signing
        id: unsigned
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-${{ env.RELEASE_VERSION }}
          path: ${{ env.STAGE }}
          if-no-files-found: error
          retention-days: 1

      - name: Sign with SignPath
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'WatchLattice' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signed

      # Swap in the signed files, then check every one of our binaries really
      # carries a valid signature before anything is zipped or checksummed.
      - name: Verify signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signed = Join-Path $env:RUNNER_TEMP 'signed'
          if (-not (Test-Path (Join-Path $signed 'Hub/ScanAlways.Protection.Service.exe'))) { throw "SignPath returned no Hub/ScanAlways.Protection.Service.exe." }
          Remove-Item $env:STAGE -Recurse -Force
          Move-Item $signed $env:STAGE

          # Mirrors the updater's rule for signed installs: every .exe and .dll
          # must carry a valid signature, and all of ours the same publisher.
          $hub = Get-AuthenticodeSignature (Join-Path $env:STAGE 'Hub/ScanAlways.Protection.Service.exe')
          if ($hub.Status -ne 'Valid') { throw "Hub/ScanAlways.Protection.Service.exe is not validly signed: $($hub.StatusMessage)" }
          $publisher = $hub.SignerCertificate.Subject
          Write-Host "Publisher: $publisher"
          $bad = @()
          foreach ($file in Get-ChildItem $env:STAGE -Recurse -Include *.exe, *.dll) {
            $sig = Get-AuthenticodeSignature $file.FullName
            $own = $file.Name -like 'WatchLattice.*' -or $file.Name -like 'ScanAlways.*'
            Write-Host ("{0,-8} {1,-5} {2}  {3}" -f $sig.Status, $(if ($own) { 'own' } else { '' }), $file.FullName.Substring($env:STAGE.Length + 1), $sig.SignerCertificate.Subject)
            if ($sig.Status -ne 'Valid' -or ($own -and $sig.SignerCertificate.Subject -cne $publisher)) { $bad += $file.Name }
          }
          if ($bad) { throw "These binaries are not validly signed by the expected publisher: $($bad -join ', ')" }

      - name: Package
        shell: pwsh
        run: |
          # Per-file hashes for the hub's install integrity check, written after
          # signing so they match the bytes that get installed.
          .github/scripts/Write-InstallManifest.ps1 -Stage $env:STAGE -Version $env:RELEASE_VERSION

          # The installer scripts go in after signing; the signing step only handles binaries.
          Copy-Item installer/* $env:STAGE
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = "dist/WatchLattice-$env:RELEASE_VERSION-win-x64.zip"
          # .NET's ZipFile writes forward-slash entry names, which the updater expects.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory($env:STAGE, (Join-Path (Resolve-Path dist).Path (Split-Path $zip -Leaf)))

          # The MSI installs the same staged (signed) files as the zip.
          .github/scripts/Build-Msi.ps1 -Stage $env:STAGE -Version $env:RELEASE_VERSION -OutFile "dist/WatchLattice-$env:RELEASE_VERSION-win-x64.msi"

      # The MSI file itself is signed in a second request, with its own
      # artifact configuration (.signpath/msi-artifact-configuration.xml).
      - name: Upload unsigned MSI for signing
        id: unsigned-msi
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-msi-${{ env.RELEASE_VERSION }}
          path: dist/WatchLattice-${{ env.RELEASE_VERSION }}-win-x64.msi
          if-no-files-found: error
          retention-days: 1

      - name: Sign MSI with SignPath
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'WatchLattice' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_MSI_ARTIFACT_CONFIGURATION_SLUG || 'msi' }}
          github-artifact-id: ${{ steps.unsigned-msi.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signed-msi

      - name: Verify MSI signature
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $name = "WatchLattice-$env:RELEASE_VERSION-win-x64.msi"
          $signed = Join-Path $env:RUNNER_TEMP "signed-msi/$name"
          if (-not (Test-Path -LiteralPath $signed)) { throw "SignPath returned no $name." }
          Move-Item -LiteralPath $signed -Destination "dist/$name" -Force
          $msi = Get-AuthenticodeSignature "dist/$name"
          $hub = Get-AuthenticodeSignature (Join-Path $env:STAGE 'Hub/ScanAlways.Protection.Service.exe')
          Write-Host "$($msi.Status)  $name  $($msi.SignerCertificate.Subject)"
          if ($msi.Status -ne 'Valid') { throw "$name is not validly signed: $($msi.StatusMessage)" }
          if ($msi.SignerCertificate.Subject -cne $hub.SignerCertificate.Subject) { throw "$name is signed by a different publisher than the hub." }

      - name: Checksum
        shell: pwsh
        run: |
          Push-Location dist
          $lines = foreach ($file in Get-ChildItem -File -Filter "WatchLattice-$env:RELEASE_VERSION-win-x64.*" | Sort-Object Name) {
            "$((Get-FileHash $file.Name -Algorithm SHA256).Hash.ToLowerInvariant())  $($file.Name)"
          }
          Pop-Location
          if (@($lines).Count -ne 2) { throw "Expected the zip and the MSI in dist/, found: $($lines -join '; ')" }
          Set-Content -Encoding ascii -Path dist/SHA256SUMS.txt -Value $lines
          Get-Content dist/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/WatchLattice-*-win-x64.*

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @('--verify-tag', '--generate-notes', '--title', "WatchLattice $env:RELEASE_VERSION")
          # This version's CHANGELOG.md section goes first; gh appends GitHub's
          # generated pull request list after it. Without a section, the
          # release gets the generated list alone, as before.
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          .github/scripts/Get-ReleaseNotes.ps1 -Version $env:RELEASE_VERSION -OutFile $notes -Repository $env:GITHUB_REPOSITORY -Ref $env:TAG
          if ($LASTEXITCODE -eq 0) {
            $flags += @('--notes-file', $notes)
          } else {
            Write-Host "::warning title=No changelog section::CHANGELOG.md has no section for $env:RELEASE_VERSION, so the release notes are only GitHub's generated list."
          }
          $global:LASTEXITCODE = 0
          if ($env:RELEASE_VERSION.Contains('-')) { $flags += '--prerelease' }
          gh release create $env:TAG dist/WatchLattice-$env:RELEASE_VERSION-win-x64.zip dist/WatchLattice-$env:RELEASE_VERSION-win-x64.msi dist/SHA256SUMS.txt @flags
