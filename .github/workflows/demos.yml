name: Demos

# Runs the reproducible demonstrations and overhead measurements in demos/ on
# fresh GitHub-hosted runners and publishes the results as the job summary
# and an artifact. Results are measurements of these runners, not claims
# about protection against real malware.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Decoy measurement window per intensity (seconds)
        default: '60'
  pull_request:
    paths:
      - 'demos/**'
      - 'src/**'
      - '.github/workflows/demos.yml'

permissions:
  contents: read

concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demos:
    name: Demos (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      SECONDS_PER_WINDOW: ${{ github.event.inputs.seconds || '60' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Run demo harness
        shell: pwsh
        run: |
          $live = if ($IsWindows) { '--live' } else { $null }
          dotnet run -c Release --no-build --project demos/WatchLattice.Demos -- all --seconds $env:SECONDS_PER_WINDOW --out demo-results $live
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content demo-results/summary.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Show decoy signals from outside the hub process
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./demos/scripts/Show-DecoySignals.ps1 -Seconds $env:SECONDS_PER_WINDOW -OutDir demo-results/decoy-hub
          Get-Content demo-results/decoy-hub/summary.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-results-${{ matrix.os }}
          path: demo-results/
          if-no-files-found: ignore
