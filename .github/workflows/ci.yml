name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the target platform; Linux keeps the shared code honest
        # about staying cross-platform.
        os: [windows-latest, ubuntu-latest]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore

  installer:
    name: Installer (windows-latest)
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The same layout as the release zip: Hub/, Tray/ and the installer scripts.
      - name: Package like a release
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'package'
          dotnet publish src/WatchLattice.Hub  -c Release -r win-x64 --self-contained false -o (Join-Path $stage 'Hub')
          dotnet publish src/WatchLattice.Tray -c Release -r win-x64 --self-contained false -o (Join-Path $stage 'Tray')
          Copy-Item LICENSE, README.md, installer/* $stage

      # The release workflow's file manifest, read back by the hub's own check.
      # Built as a non-dev version because development builds skip the check.
      - name: Install integrity check against a release manifest
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'integrity'
          dotnet publish src/WatchLattice.Hub -c Release -r win-x64 --self-contained false -p:Version=0.0.1-ci -o (Join-Path $stage 'Hub')
          .github/scripts/Write-InstallManifest.ps1 -Stage $stage -Version 0.0.1-ci
          $hub = Join-Path $stage 'Hub/ScanAlways.Protection.Service.exe'
          & $hub --verify-install
          if ($LASTEXITCODE -ne 0) { throw "A freshly packaged hub did not verify (exit $LASTEXITCODE)." }
          Add-Content -LiteralPath (Join-Path $stage 'Hub/WatchLattice.Common.dll') -Value 'tampered'
          & $hub --verify-install
          if ($LASTEXITCODE -ne 1) { throw "A changed DLL was not reported (exit $LASTEXITCODE)." }
          Write-Host 'Install integrity check reported the changed file.'
          $global:LASTEXITCODE = 0

      # Windows PowerShell 5.1, which is what users run install.ps1 with.
      - name: Install, reinstall and uninstall
        shell: powershell
        run: tests/installer/Test-Installer.ps1 -Package (Join-Path $env:RUNNER_TEMP 'package')

  msi:
    name: MSI installer (windows-latest)
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The release workflow's stage and MSI build, without signing. Two
      # versions to upgrade between, and the newer one built twice (a new
      # product code) to install over itself.
      - name: Build MSIs like a release
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'package'
          dotnet publish src/WatchLattice.Hub  -c Release -r win-x64 --self-contained false -o (Join-Path $stage 'Hub')
          dotnet publish src/WatchLattice.Tray -c Release -r win-x64 --self-contained false -o (Join-Path $stage 'Tray')
          Copy-Item LICENSE, README.md $stage
          Get-ChildItem $stage -Recurse -Filter *.pdb | Remove-Item
          .github/scripts/Write-InstallManifest.ps1 -Stage $stage -Version 0.0.0-dev
          Copy-Item installer/* $stage
          $msis = Join-Path $env:RUNNER_TEMP 'msi'
          .github/scripts/Build-Msi.ps1 -Stage $stage -Version 0.0.1 -OutFile (Join-Path $msis 'WatchLattice-0.0.1-win-x64.msi')
          .github/scripts/Build-Msi.ps1 -Stage $stage -Version 0.0.2 -OutFile (Join-Path $msis 'WatchLattice-0.0.2-win-x64.msi')
          .github/scripts/Build-Msi.ps1 -Stage $stage -Version 0.0.2-rebuilt -OutFile (Join-Path $msis 'WatchLattice-0.0.2-rebuilt-win-x64.msi')

      # Windows PowerShell 5.1, which is what the MSI runs install.ps1 with.
      - name: Install, upgrade, reinstall and uninstall
        shell: powershell
        run: |
          $msis = Join-Path $env:RUNNER_TEMP 'msi'
          tests/installer/Test-Msi.ps1 -Package (Join-Path $env:RUNNER_TEMP 'package') `
            -Msi (Join-Path $msis 'WatchLattice-0.0.1-win-x64.msi') `
            -UpgradeMsi (Join-Path $msis 'WatchLattice-0.0.2-win-x64.msi') `
            -RebuiltMsi (Join-Path $msis 'WatchLattice-0.0.2-rebuilt-win-x64.msi') `
            -LogDir (Join-Path $env:RUNNER_TEMP 'msi-logs')

      - name: Upload MSI logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msi-logs
          path: ${{ runner.temp }}/msi-logs
          if-no-files-found: ignore

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The release workflow turns a tag's CHANGELOG.md section into its
      # release notes; check every released version's section still reads.
      - name: Every version has release notes
        shell: pwsh
        run: |
          $versions = Select-String -LiteralPath CHANGELOG.md -Pattern '^## \[(\d+\.\d+\.\d+[^\]]*)\]' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          if (-not $versions) { throw 'CHANGELOG.md has no version sections.' }
          foreach ($version in $versions) {
            .github/scripts/Get-ReleaseNotes.ps1 -Version $version -OutFile (Join-Path $env:RUNNER_TEMP "notes-$version.md")
            if ($LASTEXITCODE -ne 0) { throw "No release notes for $version." }
          }
