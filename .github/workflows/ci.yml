name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the target platform; Linux keeps the shared code honest
        # about staying cross-platform.
        os: [windows-latest, ubuntu-latest]

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore

  installer:
    name: Installer (windows-latest)
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The same layout as the release zip: Hub/, Tray/ and the installer scripts.
      - name: Package like a release
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'package'
          dotnet publish src/WatchLattice.Hub  -c Release -r win-x64 --self-contained false -o (Join-Path $stage 'Hub')
          dotnet publish src/WatchLattice.Tray -c Release -r win-x64 --self-contained false -o (Join-Path $stage 'Tray')
          Copy-Item LICENSE, README.md, installer/* $stage

      # Windows PowerShell 5.1, which is what users run install.ps1 with.
      - name: Install, reinstall and uninstall
        shell: powershell
        run: tests/installer/Test-Installer.ps1 -Package (Join-Path $env:RUNNER_TEMP 'package')
